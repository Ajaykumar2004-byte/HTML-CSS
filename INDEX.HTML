<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Weather Dashboard</title>
  <style>
    /* ── DESIGN SYSTEM ── */
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
    }

    /* ── CARDS & LAYOUT ── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      margin-bottom: 16px;
    }

    /* ── SEARCH BAR ── */
    .search-box {
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      padding: 12px 20px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 30px;
      padding: 0 24px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .search-box button:hover {
      opacity: 0.9;
    }

    /* ── CURRENT WEATHER ── */
    .weather-main {
      text-align: center;
      position: relative;
      padding: 10px 0;
    }

    .location-name {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .weather-emoji {
      font-size: 4.5rem;
      margin: 10px 0;
      line-height: 1;
    }

    .temperature {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 6px;
    }

    .condition {
      font-size: 1.1rem;
      color: var(--text-muted);
      text-transform: capitalize;
    }

    /* ── METRICS GRID ── */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .metric-item {
      background: rgba(15, 23, 42, 0.3);
      padding: 14px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .metric-value {
      font-size: 1.2rem;
      font-weight: 600;
    }

    /* ── FORECAST LOOKOUT ── */
    .forecast-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 14px;
      font-weight: 600;
    }

    .forecast-row {
      display: flex;
      
      flex-direction: column;
      gap: 12px;
    }

    .forecast-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.2);
      padding: 12px 16px;
      border-radius: 12px;
    }

    .forecast-day {
      width: 80px;
      font-weight: 500;
    }

    .forecast-emoji {
      font-size: 1.4rem;
    }

    .forecast-temp {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    /* ── CREDENTIALS LINK ── */
    .api-config {
      font-size: 0.75rem;
      text-align: center;
      color: var(--text-muted);
    }
    .api-config input {
      background: none;
      border: none;
      border-bottom: 1px dashed var(--text-muted);
      color: var(--accent);
      padding: 2px;
      width: 140px;
      outline: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- SEARCH COMPONENT -->
    <div class="card">
      <div class="search-box">
        <input type="text" id="city-search" placeholder="Enter city name..." value="London">
        <button id="search-btn">Search</button>
      </div>
    </div>

    <!-- MAIN WEATHER DISPLAY -->
    <div class="card">
      <div class="weather-main">
        <div class="location-name" id="location-name">London, GB</div>
        <div class="weather-emoji" id="weather-emoji">⛅</div>
        <div class="temperature" id="current-temp">18°C</div>
        <div class="condition" id="current-condition">Partly Cloudy</div>
      </div>

      <div class="metrics-grid">
        <div class="metric-item">
          <span class="metric-label">Humidity</span>
          <span class="metric-value" id="humidity-val">64%</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Wind Speed</span>
          <span class="metric-value" id="wind-val">12 km/h</span>
        </div>
      </div>
    </div>

    <!-- 3-DAY OUTLOOK -->
    <div class="card">
      <div class="forecast-title">3-Day Outlook</div>
      <div class="forecast-row" id="forecast-container">
        <!-- Injected via JavaScript -->
      </div>
    </div>

    <!-- LIVE API ACCESS CONFIG -->
    <div class="api-config">
      Running on simulator. Enter <input type="text" id="api-key-input" placeholder="OpenWeather API Key"> for live data.
    </div>

  </div>

  <script>
    // ── APPLICATION STATE & CONFIG ──
    let apiKey = '';

    const simulatedDatabase = {
      'london': { name: 'London, GB', temp: 18, cond: 'Partly Cloudy', emoji: '⛅', hum: 64, wind: 12, fore: [{d:'Tomorrow', e:'🌧', t:14}, {d:'Wednesday', e:'🌤', t:17}, {d:'Thursday', e:'☀️', t:20}] },
      'new york': { name: 'New York, US', temp: 22, cond: 'Clear Sky', emoji: '☀️', hum: 52, wind: 15, fore: [{d:'Tomorrow', e:'☀️', t:24}, {d:'Wednesday', e:'⛅', t:21}, {d:'Thursday', e:'⛈', t:19}] },
      'tokyo': { name: 'Tokyo, JP', temp: 26, cond: 'Light Rain', emoji: '🌦', hum: 78, wind: 8, fore: [{d:'Tomorrow', e:'☁️', t:23}, {d:'Wednesday', e:'☀️', t:27}, {d:'Thursday', e:'🌤', t:25}] },
      'delhi': { name: 'New Delhi, IN', temp: 34, cond: 'Hazy Sun', emoji: '🔆', hum: 41, wind: 10, fore: [{d:'Tomorrow', e:'🔆', t:36}, {d:'Wednesday', e:'🔆', t:35}, {d:'Thursday', e:'⛈', t:31}] }
    };

    // ── DOM ELEMENTS ──
    const searchInput = document.getElementById('city-search');
    const searchBtn = document.getElementById('search-btn');
    const apiKeyInput = document.getElementById('api-key-input');

    // ── INTERACTIVE APP LOGIC ──
    function init() {
      updateUI(simulatedDatabase['london']);
      
      searchBtn.addEventListener('click', handleSearch);
      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSearch();
      });
      
      apiKeyInput.addEventListener('input', (e) => {
        apiKey = e.target.value.trim();
      });
    }

    function handleSearch() {
      const query = searchInput.value.trim().toLowerCase();
      if (!query) return;

      if (apiKey) {
        fetchLiveWeather(query);
      } else {
        // Fall back to simulator architecture
        const data = simulatedDatabase[query] || {
          name: searchInput.value + ', Global',
          temp: Math.floor(Math.random() * 15) + 15,
          cond: 'Mainly Sunny',
          emoji: '☀️',
          hum: Math.floor(Math.random() * 40) + 40,
          wind: Math.floor(Math.random() * 20) + 5,
          fore: [{d:'Tomorrow', e:'⛅', t:22}, {d:'Wednesday', e:'🌧', t:18}, {d:'Thursday', e:'☀️', t:24}]
        };
        updateUI(data);
      }
    }

    function updateUI(data) {
      document.getElementById('location-name').textContent = data.name;
      document.getElementById('current-temp').textContent = `${data.temp}°C`;
      document.getElementById('current-condition').textContent = data.cond;
      document.getElementById('weather-emoji').textContent = data.emoji;
      document.getElementById('humidity-val').textContent = `${data.hum}%`;
      document.getElementById('wind-val').textContent = `${data.wind} km/h`;

      const forecastContainer = document.getElementById('forecast-container');
      forecastContainer.innerHTML = '';
      data.fore.forEach(item => {
        const row = document.createElement('div');
        row.className = 'forecast-item';
        row.innerHTML = `
          <span class="forecast-day">${item.d}</span>
          <span class="forecast-emoji">${item.e}</span>
          <span class="forecast-temp">${item.t}°C</span>
        `;
        forecastContainer.appendChild(row);
      });
    }

    // ── LIVE API NETWORK HANDLER ──
    async function fetchLiveWeather(city) {
      try {
        const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric`);
        if (!response.ok) throw new Error('City not found or invalid API Key.');
        
        const d = await response.json();
        const mappedData = {
          name: `${d.name}, ${d.sys.country}`,
          temp: Math.round(d.main.temp),
          cond: d.weather[0].description,
          emoji: getConditionEmoji(d.weather[0].id),
          hum: d.main.humidity,
          wind: Math.round(d.wind.speed * 3.6), // Convert m/s to km/h
          fore: [
            {d: 'Tomorrow', e: '⛅', t: Math.round(d.main.temp + (Math.random() * 4 - 2))},
            {d: 'Next Day', e: '🌤', t: Math.round(d.main.temp + (Math.random() * 4 - 2))},
            {d: 'Following', e: '☁️', t: Math.round(d.main.temp + (Math.random() * 4 - 2))}
          ]
        };
        updateUI(mappedData);
      } catch (err) {
        alert(err.message);
      }
    }

    function getConditionEmoji(code) {
      if (code >= 200 && code < 300) return '⛈'; // Thunderstorm
      if (code >= 300 && code < 400) return '🌦'; // Drizzle
      if (code >= 500 && code < 600) return '🌧'; // Rain
      if (code >= 600 && code < 700) return '❄️'; // Snow
      if (code === 800) return '☀️';              // Clear
      if (code === 801) return '🌤';              // Few Clouds
      return '☁️';                                 // Overcast
    }

    init();
  </script>
</body>
</html>
